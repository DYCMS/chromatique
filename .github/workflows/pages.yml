name: Vérifier et publier sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester le moteur et le contrat API 0.2
        run: npm test
      - name: Installer le navigateur pour les tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Vérifier le jeu dans Chromium et sur écran tactile émulé
        run: |
          node tests/browser.cjs
          node tests/api02-browser.cjs
      - name: Préparer uniquement les fichiers publics
        run: |
          mkdir -p _site
          cp index.html styles.css game.js extensions.js app.js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium pour vérifier le site publié
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Vérifier le contrat 0.2 et son interface sur GitHub Pages
        env:
          CHROMATIQUE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/api02-browser.cjs
