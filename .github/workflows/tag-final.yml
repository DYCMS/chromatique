name: Actualiser le tag final pour la remise J2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tag-final.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la version retenue
        run: npm test
      - name: Actualiser uniquement le tag final attendu
        shell: bash
        env:
          EXPECTED_FINAL: 21d6d76c270f916ab0e0ae137561d3a3c4c39519
        run: |
          set -euo pipefail
          actual="$(git rev-parse refs/tags/final)"
          if [ "$actual" = "$GITHUB_SHA" ]; then
            echo "Le tag final correspond déjà à cette version."
            exit 0
          fi
          if [ "$actual" != "$EXPECTED_FINAL" ]; then
            echo "Le tag final a changé : aucune référence n'est modifiée."
            exit 1
          fi
          git tag -f final "$GITHUB_SHA"
          git push --force-with-lease="refs/tags/final:$EXPECTED_FINAL" origin refs/tags/final
